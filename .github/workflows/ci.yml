name: CI

on:
  push:
    branches: [main, feature/phase1-core-implementation]
  pull_request:
    branches: [main, feature/phase1-core-implementation]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Typecheck + Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Shadow calculator guard
        run: ./scripts/check-shadow-calculators.sh

  e2e:
    name: Playwright (golden paths)
    runs-on: ubuntu-latest
    # No continue-on-error. This job gates.
    #
    # It used to be exempt "while Expo web in CI is being stabilized", and it
    # then failed on every run for months — the flag meant nobody saw it. A
    # suite that always fails is the same as no suite, with the added cost of
    # training people to ignore a red mark.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tests the artifact that actually ships — a static export, not the
      # Metro dev server. See the note in playwright.config.ts for why.
      # `npm run e2e` builds the export and runs the specs; Playwright starts
      # and stops the server itself (see playwright.config.ts). The same one
      # command reproduces this job locally rather than approximating it.
      - name: Build web export and run e2e
        run: npm run e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
